<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bot playground</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef1f5;
        --surface: #ffffff;
        --surface-2: #f5f7fa;
        --border: #d9dee6;
        --text: #16191f;
        --muted: #667085;
        --accent: #2f80ed;
        --accent-text: #ffffff;
        --user-bubble: #dbeafe;
        --danger: #d92d20;
        --shadow: 0 1px 2px rgb(16 24 40 / 8%);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1216;
          --surface: #1a1f26;
          --surface-2: #222933;
          --border: #2e3642;
          --text: #e7eaee;
          --muted: #98a2b3;
          --accent: #5b9df5;
          --accent-text: #0b1220;
          --user-bubble: #1e3a5f;
          --danger: #f97066;
          --shadow: none;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      header,
      footer {
        background: var(--surface);
        border-color: var(--border);
        border-style: solid;
        border-width: 0;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom-width: 1px;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
        flex: none;
      }
      .title {
        flex: 1;
        min-width: 0;
      }
      .title strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .title small {
        color: var(--muted);
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .ghost {
        border: 1px solid var(--border);
        background: var(--surface-2);
        border-radius: 8px;
        padding: 6px 12px;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
      }
      .column {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 760px;
        margin: 0 auto;
      }
      .empty {
        margin: 15vh auto 0;
        color: var(--muted);
        text-align: center;
      }
      .message {
        display: flex;
        flex-direction: column;
        max-width: min(560px, 85%);
      }
      .message.user {
        align-self: flex-end;
        align-items: flex-end;
      }
      .message.bot {
        align-self: flex-start;
      }
      .bubble {
        padding: 8px 12px;
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .user .bubble {
        background: var(--user-bubble);
      }
      .bubble code,
      .bubble pre {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 13px;
        background: var(--surface-2);
        border-radius: 4px;
        padding: 0 3px;
      }
      .bubble pre {
        padding: 6px 8px;
        margin: 4px 0;
        overflow-x: auto;
      }
      .bubble blockquote {
        margin: 4px 0;
        padding-left: 8px;
        border-left: 3px solid var(--accent);
      }
      .bubble a {
        color: var(--accent);
      }
      .spoiler {
        background: var(--muted);
        color: transparent;
        border-radius: 3px;
        cursor: pointer;
      }
      .spoiler.shown {
        background: none;
        color: inherit;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
        margin: 2px 6px 0;
      }
      .keyboard {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 4px;
      }
      .keyboard .row {
        display: flex;
        gap: 4px;
      }
      .keyboard button,
      .keyboard a {
        flex: 1;
        min-width: 0;
        padding: 6px 10px;
        border: 0;
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
        color: var(--accent);
        text-align: center;
        text-decoration: none;
        font-size: 14px;
      }
      .keyboard button:hover,
      .keyboard a:hover {
        background: var(--surface-2);
      }
      footer {
        border-top-width: 1px;
        padding: 10px 16px 14px;
      }
      footer .column {
        gap: 8px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chips button {
        border: 1px solid var(--border);
        background: var(--surface-2);
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 13px;
      }
      .reply-keyboard {
        display: grid;
        gap: 4px;
      }
      .reply-keyboard .row {
        display: flex;
        gap: 4px;
      }
      .reply-keyboard button {
        flex: 1;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-2);
      }
      form {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface-2);
        color: var(--text);
        font: inherit;
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      .send {
        border: 0;
        border-radius: 10px;
        padding: 0 16px;
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
      }
      .toasts {
        position: fixed;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: min(420px, calc(100% - 32px));
        pointer-events: none;
      }
      .toast {
        padding: 10px 14px;
        border-radius: 10px;
        background: var(--text);
        color: var(--bg);
        box-shadow: 0 4px 16px rgb(0 0 0 / 20%);
        pointer-events: auto;
      }
      .toast.alert {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .toast.error {
        background: var(--danger);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="avatar" id="avatar">B</div>
      <div class="title">
        <strong id="app-name">Bot</strong>
        <small>Playground · a local chat, nothing is sent to Telegram</small>
      </div>
      <button class="ghost" id="reset" type="button" title="Clear the chat and the conversation state">
        Reset
      </button>
    </header>
    <main id="scroller">
      <div class="column" id="messages"></div>
    </main>
    <footer>
      <div class="column">
        <div class="chips" id="commands"></div>
        <div class="reply-keyboard" id="reply-keyboard"></div>
        <form id="composer" autocomplete="off">
          <input id="text" maxlength="4096" placeholder="Write a message… (try /start)" autofocus />
          <button class="send" type="submit">Send</button>
        </form>
      </div>
    </footer>
    <div class="toasts" id="toasts"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      // Requests run one after another, in the order the user acted.
      let queue = Promise.resolve();

      // Telegram's HTML subset (https://core.telegram.org/bots/api#html-style); everything else
      // becomes plain text, so bot output can never inject markup into this page.
      const ALLOWED = new Set(['b', 'strong', 'i', 'em', 'u', 'ins', 's', 'strike', 'del', 'code', 'pre', 'a', 'blockquote']);

      function renderHtml(source) {
        const doc = new DOMParser().parseFromString(`<body>${source}</body>`, 'text/html');
        const fragment = document.createDocumentFragment();
        const copy = (node, parent) => {
          for (const child of node.childNodes) {
            if (child.nodeType === Node.TEXT_NODE) {
              parent.append(child.textContent);
              continue;
            }
            if (child.nodeType !== Node.ELEMENT_NODE) continue;
            const tag = child.tagName.toLowerCase();
            const spoiler = tag === 'tg-spoiler' || (tag === 'span' && child.classList.contains('tg-spoiler'));
            let element = null;
            if (spoiler) {
              element = document.createElement('span');
              element.className = 'spoiler';
              element.addEventListener('click', () => element.classList.add('shown'));
            } else if (ALLOWED.has(tag)) {
              element = document.createElement(tag);
              const href = child.getAttribute('href') || '';
              if (tag === 'a' && /^(https?:|tg:|mailto:)/i.test(href)) {
                element.href = href;
                element.target = '_blank';
                element.rel = 'noopener noreferrer';
              }
            }
            copy(child, element || parent);
            if (element) parent.append(element);
          }
        };
        copy(doc.body, fragment);
        return fragment;
      }

      function toast(text, kind) {
        const element = document.createElement('div');
        element.className = `toast ${kind}`;
        element.textContent = text;
        $('toasts').append(element);
        const close = () => element.remove();
        if (kind === 'alert') element.addEventListener('click', close);
        setTimeout(close, kind === 'toast' ? 2500 : 6000);
      }

      function button(text, onClick) {
        const element = document.createElement('button');
        element.type = 'button';
        element.textContent = text;
        element.addEventListener('click', onClick);
        return element;
      }

      function render(state) {
        document.title = `${state.appName} · playground`;
        $('app-name').textContent = state.appName;
        $('avatar').textContent = state.appName.trim().charAt(0).toUpperCase() || 'B';

        const list = $('messages');
        list.replaceChildren();
        if (state.messages.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'empty';
          empty.textContent = `You are ${state.userName}. Send /start to begin.`;
          list.append(empty);
        }
        for (const message of state.messages) {
          const item = document.createElement('div');
          item.className = `message ${message.sender}`;
          const bubble = document.createElement('div');
          bubble.className = 'bubble';
          if (message.html) bubble.append(renderHtml(message.text));
          else bubble.textContent = message.text;
          item.append(bubble);

          if (message.buttons.length > 0) {
            const keyboard = document.createElement('div');
            keyboard.className = 'keyboard';
            for (const row of message.buttons) {
              const line = document.createElement('div');
              line.className = 'row';
              for (const key of row) {
                if (key.url) {
                  const link = document.createElement('a');
                  link.href = key.url;
                  link.target = '_blank';
                  link.rel = 'noopener noreferrer';
                  link.textContent = `${key.text} ↗`;
                  line.append(link);
                } else {
                  line.append(button(key.text, () => call('/api/callbacks', { messageId: message.id, data: key.data })));
                }
              }
              keyboard.append(line);
            }
            item.append(keyboard);
          }

          const meta = [];
          if (message.edited) meta.push('edited');
          if (message.chatId !== null) meta.push(`sent to chat ${message.chatId}`);
          if (meta.length > 0) {
            const note = document.createElement('div');
            note.className = 'meta';
            note.textContent = meta.join(' · ');
            item.append(note);
          }
          list.append(item);
        }

        $('commands').replaceChildren(
          ...state.commands.map((c) => {
            const chip = button(c.command, () => send(c.command));
            chip.title = c.description;
            return chip;
          }),
        );

        const reply = $('reply-keyboard');
        reply.replaceChildren();
        for (const row of state.replyKeyboard || []) {
          const line = document.createElement('div');
          line.className = 'row';
          for (const text of row) line.append(button(text, () => send(text)));
          reply.append(line);
        }

        for (const notice of state.notices) toast(notice.text, notice.kind);
        const scroller = $('scroller');
        scroller.scrollTop = scroller.scrollHeight;
      }

      function call(path, body) {
        queue = queue.then(() => request(path, body));
        return queue;
      }

      async function request(path, body) {
        try {
          const response = await fetch(path, {
            method: body === undefined ? 'GET' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: body === undefined ? undefined : JSON.stringify(body),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
          render(data);
        } catch (error) {
          toast(`Playground error: ${error.message}. Is the dev server running?`, 'error');
        }
      }

      function send(text) {
        if (text.trim()) call('/api/messages', { text });
      }

      $('composer').addEventListener('submit', (event) => {
        event.preventDefault();
        const text = $('text').value;
        $('text').value = '';
        send(text);
        $('text').focus();
      });
      $('reset').addEventListener('click', () => call('/api/reset', {}));
      call('/api/state');
    </script>
  </body>
</html>
