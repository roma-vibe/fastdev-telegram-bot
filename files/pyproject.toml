[project]
name = "app"
version = "0.1.0"
description = "Telegram bot built with aiogram 3 and SQLite."
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31,<4",
    "aiosqlite>=0.22",
    "pydantic-settings>=2.15",
    "python-dotenv>=1.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "poethepoet>=0.48",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "watchfiles>=1.3",
]

[tool.uv]
# An application, not a library: dependencies are installed, the project itself is not.
package = false

# ---------------------------------------------------------------------------
# Tasks: `uv run poe <task>` (`uv run poe` lists them).
# ---------------------------------------------------------------------------

[tool.poe.tasks.dev]
help = "Playground on PLAYGROUND_PORT and long polling (when BOT_TOKEN is set), restarting on changes"
cmd = "python -m app dev"

[tool.poe.tasks.start]
help = "Run the bot like in production: polling or webhook (BOT_MODE) and /health on APP_PORT"
cmd = "python -m app run"

[tool.poe.tasks.migrate]
help = "Apply pending database migrations (the bot also applies them on start)"
cmd = "python -m app migrate"

[tool.poe.tasks.test]
help = "Run the tests (extra arguments go to pytest)"
cmd = "pytest"

[tool.poe.tasks.lint]
help = "Lint with Ruff"
cmd = "ruff check"

[tool.poe.tasks.typecheck]
help = "Type-check with mypy (strict)"
cmd = "mypy"

[tool.poe.tasks.format]
help = "Format all Python files with Ruff"
cmd = "ruff format"

[tool.poe.tasks.fix]
help = "Fix lint problems that Ruff can fix, then format"
sequence = [{ cmd = "ruff check --fix" }, { cmd = "ruff format" }]

[tool.poe.tasks.check]
help = "Quality gate: lint, format check, type check and tests"
sequence = [
    { cmd = "ruff check" },
    { cmd = "ruff format --check" },
    { cmd = "mypy" },
    { cmd = "pytest" },
]

# ---------------------------------------------------------------------------
# Tools
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # import sorting
    "N",     # naming
    "UP",    # modern syntax
    "B",     # likely bugs
    "A",     # shadowed builtins
    "C4",    # comprehensions
    "DTZ",   # timezone-aware datetimes
    "SIM",   # simplifications
    "RET",   # return statements
    "PTH",   # pathlib instead of os.path
    "G",     # logging format strings
    "LOG",   # logging usage
    "ASYNC", # asyncio pitfalls
    "PT",    # pytest style
    "RUF",   # Ruff-specific rules
]

[tool.mypy]
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A warning is a failure: the project stays at zero warnings.
filterwarnings = ["error"]
